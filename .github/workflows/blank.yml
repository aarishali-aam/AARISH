name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        required: true
        default: "debug"
        description: "Build Type"
        options:
          - "debug"
          - "staging"
          - "release"
          - "ghRelease"
      release:
        type: boolean
        description: "Release built APKs"
      tag:
        type: string
        description: "Tag for the release"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # Sets up Ruby and caches your Gemfile/Bundler dependencies
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true 

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Executes Fastlane and passes the GitHub input as an environment variable or argument
      - name: Run Fastlane for Android
        env:
          BUILD_TYPE: ${{ github.event.inputs.buildType }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          bundle exec fastlane android deploy type:"$BUILD_TYPE"

      # Moves generated APKs to root if your Fastlane lane outputs them deep in the project directory
      - name: Move APKs to root (Optional adjustments may be needed based on Fastfile config)
        run: |
          find app/build/outputs/apk/ -name "*.apk" -exec mv {} . \; 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build output
          path: ./*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.inputs.buildType == 'ghRelease' && github.event.inputs.release == 'true' && startsWith(github.event.inputs.tag, 'v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch APKs
        uses: actions/download-artifact@v4
        with:
          path: ./
          merge-multiple: true

      - name: Create new tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git fetch --tags
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi
          git push origin "refs/tags/$TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag }}
          files: "*.apk"
          generate_release_notes: true
