name: Build APK

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        required: true
        default: "debug"
        description: "Build Type"
        options:
          - "debug"
          - "staging"
          - "release"
          - "ghRelease"
      release:
        type: boolean
        description: "Release built APKs"
      tag:
        type: string
        description: "Tag for the release"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.buildType }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease
            mv app/build/outputs/apk/release/*.apk .
          elif [ "$BUILD_TYPE" = "ghRelease" ]; then
            ./gradlew assembleGithubRelease
            mv app/build/outputs/apk/githubRelease/*.apk .
          elif [ "$BUILD_TYPE" = "staging" ]; then
            ./gradlew assembleDebug -PtargetABI=arm64-v8a
            mv app/build/outputs/apk/debug/*.apk .
          elif [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
            mv app/build/outputs/apk/debug/*.apk .
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build output
          path: ./*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.inputs.buildType == 'ghRelease' && github.event.inputs.release == 'true' && startsWith(github.event.inputs.tag, 'v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch APKs
        uses: actions/download-artifact@v4
        with:
          path: ./
          merge-multiple: true

      - name: Create new tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git fetch --tags
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi
          git push origin "refs/tags/$TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag }}
          files: "*.apk"
          generate_release_notes: true
